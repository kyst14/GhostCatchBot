name: Run Tests

# Run on push
on: [push]

jobs:
    run-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Run lint
              run: npm link
            
            - name: Build
              run: npm run build